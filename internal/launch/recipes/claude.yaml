# Claude Code (Anthropic). https://docs.anthropic.com/en/docs/claude-code
name: claude
description: Claude Code CLI
auth: either
providers: [anthropic]
subscription:
  login: ["claude", "auth", "login", "--claudeai"]
  status: ["claude", "auth", "status"]
  logout: ["claude", "auth", "logout"]
  unset_env: ["ANTHROPIC_API_KEY", "ANTHROPIC_AUTH_TOKEN", "ANTHROPIC_BASE_URL"]
  verify: |
    status="$(claude auth status --json 2>/dev/null)" || exit 1
    compact="$(printf '%s' "$status" | tr -d '[:space:]')"
    case "$compact" in *'"loggedIn":true'*) ;; *) exit 1;; esac
    case "$compact" in *'"authMethod":"oauth_token"'*) ;; *) exit 1;; esac
    case "$compact" in *'"apiProvider":"firstParty"'*) ;; *) exit 1;; esac
hosts:
  - registry.npmjs.org
  - statsig.anthropic.com
  - platform.claude.com
install: |
  export NPM_CONFIG_PREFIX="${NPM_CONFIG_PREFIX:-$HOME/.local}"
  export PATH="$NPM_CONFIG_PREFIX/bin:$PATH"
  command -v claude >/dev/null 2>&1 || npm install -g @anthropic-ai/claude-code
env:
  # No update checks, telemetry or error reporting from inside a workspace.
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
  DISABLE_AUTOUPDATER: "1"
  DISABLE_TELEMETRY: "1"
  DISABLE_ERROR_REPORTING: "1"
  ANTHROPIC_MODEL: "{{.Model}}"
  PATH: "${NPM_CONFIG_PREFIX:-$HOME/.local}/bin:$PATH"
command: ["claude", "-p", "{{.Task}}", "--output-format", "text"]
resume_command: ["claude", "{{if .Conversation}}--resume={{.Conversation}}{{else}}--continue{{end}}", "-p", "{{.Task}}", "--output-format", "text"]
sandbox_flags:
  read-only: ["--permission-mode", "plan"]
  workspace-write: ["--permission-mode", "acceptEdits"]
  full: ["--dangerously-skip-permissions"]
state_dirs: [".claude", ".claude.json"]
path_keyed: true
# ACP through the official adapter (npm @agentclientprotocol/claude-agent-acp);
# subscription auth stays workspace-resident per ADR 0039.
acp:
  command: ["npx", "-y", "@agentclientprotocol/claude-agent-acp"]
  adapter: "@agentclientprotocol/claude-agent-acp"
  load_session: true
  sandbox_modes:
    read-only: plan
    workspace-write: acceptEdits
    full: bypassPermissions
