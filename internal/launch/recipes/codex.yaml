# OpenAI Codex CLI. https://github.com/openai/codex
name: codex
description: OpenAI Codex CLI
auth: either
providers: [openai, azure-openai, openrouter]
subscription:
  login: ["codex", "login", "--device-auth"]
  status: ["codex", "login", "status"]
  logout: ["codex", "logout"]
  # Device-code login goes through auth.openai.com; a ChatGPT-backed launch
  # talks to chatgpt.com directly, with no broker in between.
  hosts: [chatgpt.com, auth.openai.com]
  unset_env: ["CODEX_API_KEY", "OPENAI_API_KEY", "OPENAI_BASE_URL", "AZURE_OPENAI_API_KEY"]
  # codex 0.153 prints its status line on stderr (verified live 2026-09-07),
  # so both streams are captured; the exit status still gates the check.
  verify: |
    status="$(codex login status 2>&1)" || exit 1
    case "$status" in "Logged in using ChatGPT"*) ;; *) exit 1;; esac
hosts:
  - registry.npmjs.org
install: |
  export NPM_CONFIG_PREFIX="${NPM_CONFIG_PREFIX:-$HOME/.local}"
  export PATH="$NPM_CONFIG_PREFIX/bin:$PATH"
  command -v codex >/dev/null 2>&1 || npm install -g @openai/codex
env:
  CODEX_API_KEY: "{{if .Primary}}{{key .Primary}}{{end}}"
  PATH: "${NPM_CONFIG_PREFIX:-$HOME/.local}/bin:$PATH"
configure:
  - path: .remount/launch/codex-driver
    content: |
      set -eu
      exec codex{{if .Primary}} -c "openai_base_url=\"\{{baseURL .Primary}}\""{{end}} "\$@"
command: ["sh", ".remount/launch/codex-driver", "exec", "--skip-git-repo-check", "{{.Task}}"]
resume_command: ["sh", ".remount/launch/codex-driver", "exec", "resume", "{{if .Conversation}}{{.Conversation}}{{else}}--last{{end}}", "--skip-git-repo-check", "{{.Task}}"]
model_flags: ["--model", "{{.Model}}"]
sandbox_flags:
  read-only: ["--sandbox", "read-only"]
  workspace-write: ["--sandbox", "workspace-write"]
  full: ["--sandbox", "danger-full-access"]
state_dirs: [".codex"]
path_keyed: true
# ACP through the official adapter (npm @agentclientprotocol/codex-acp).
acp:
  command: ["npx", "-y", "@agentclientprotocol/codex-acp"]
  adapter: "@agentclientprotocol/codex-acp"
  env:
    CODEX_CONFIG: '{{if .Primary}}{"openai_base_url":"{{baseURL .Primary}}"}{{end}}'
    DEFAULT_AUTH_REQUEST: '{{if .Primary}}{"methodId":"api-key"}{{end}}'
    INITIAL_AGENT_MODE: '{{if eq .Sandbox "read-only"}}read-only{{else if eq .Sandbox "full"}}agent-full-access{{else}}agent{{end}}'
