name: firecracker-kvm

on:
  workflow_dispatch:

permissions:
  contents: read

# One run per workflow per ref. A newer push makes an older run's result
# irrelevant, and on a private repo that superseded run is still being
# billed - macOS minutes at 10x and Windows at 2x.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kvm:
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Require the real host gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::unavailable: /dev/kvm is not readable and writable"
            exit 1
          fi
          for binary in firecracker jailer; do
            if ! command -v "$binary" >/dev/null; then
              echo "::error::unavailable: $binary is not installed"
              exit 1
            fi
            "$binary" --version
          done
          if [[ -z ${REMOUNT_FIRECRACKER_KERNEL:-} || ! -f ${REMOUNT_FIRECRACKER_KERNEL} ]]; then
            echo "::error::unavailable: REMOUNT_FIRECRACKER_KERNEL is not an explicit kernel artifact"
            exit 1
          fi
          if [[ -z ${REMOUNT_FIRECRACKER_ROOTFS:-} || ! -f ${REMOUNT_FIRECRACKER_ROOTFS} ]]; then
            echo "::error::unavailable: REMOUNT_FIRECRACKER_ROOTFS is not an explicit base rootfs artifact"
            exit 1
          fi
          if [[ -z ${REMOUNT_FIRECRACKER_GUEST_MANIFEST:-} || ! -f ${REMOUNT_FIRECRACKER_GUEST_MANIFEST} ]]; then
            echo "::error::unavailable: REMOUNT_FIRECRACKER_GUEST_MANIFEST is not an explicit guest manifest"
            exit 1
          fi
          if [[ -z ${REMOUNT_FIRECRACKER_DATA_ROOT:-} || ! -d ${REMOUNT_FIRECRACKER_DATA_ROOT} ]]; then
            echo "::error::unavailable: REMOUNT_FIRECRACKER_DATA_ROOT is not an explicit data root"
            exit 1
          fi
      - name: Run deterministic lifecycle proofs
        run: |
          set -euo pipefail
          go vet ./internal/workspace/firecracker
          go test -race -count=10 ./internal/workspace/firecracker
      - name: Run exact-host Firecracker conformance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          REMOUNT_FIRECRACKER_BINARY="$(command -v firecracker)" \
          REMOUNT_FIRECRACKER_JAILER="$(command -v jailer)" \
          REMOUNT_FIRECRACKER_CGROUP_PARENT="${REMOUNT_FIRECRACKER_CGROUP_PARENT:-remount}" \
            ./scripts/firecracker-conformance.sh 2>&1 | tee artifacts/firecracker-conformance.log
      - name: Archive exact-host evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firecracker-kvm-${{ github.sha }}
          path: artifacts/firecracker-conformance.log
          if-no-files-found: error
