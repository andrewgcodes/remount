name: plan-b

permissions:
  contents: read

# The Plan B aggregate gate. It is a status report, not a completion claim: the
# run succeeds while required scenarios are still open, and the uploaded
# summary lists every one of them with its missing prerequisite. Add
# --require-complete when the registry is actually wired.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

# One run per workflow per ref. A newer push makes an older run's result
# irrelevant, and on a private repo that superseded run is still being
# billed - macOS minutes at 10x and Windows at 2x.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
      # A checkout is clean, so the gate runs without developer mode and the
      # recorded candidate is the commit it actually tested.
      - name: aggregate gate
        run: make plan-b
        env:
          # The 10,000-cursor B30 width in the verification ledger is a
          # machine-sized measurement (8 CPUs, 31 GiB). A hosted runner has
          # a quarter of that: at 10,000 the third cursor cycle replays a log
          # that has grown for minutes into 10,000 attach buffers, the heap
          # passes 4 GiB and attaches time out. The ceilings are slopes
          # across identical cycles, so the width is not what the row
          # proves; 2,000 keeps the run inside the runner and leaves the
          # ledger measurement as the wide one.
          REMOUNT_SCALE_CURSORS: "2000"
      - name: summary
        if: always()
        run: cat dist/plan-b/summary.md >> "$GITHUB_STEP_SUMMARY"
      # Runtime evidence is candidate-scoped, never committed as evergreen proof.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: plan-b-evidence
          path: dist/plan-b/
