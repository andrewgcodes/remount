name: Operator console

on:
  workflow_dispatch:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      # The E15 suite drives this binary; every server the browser talks to is
      # started from it by web/tests/e15/global-setup.mjs.
      REMOUNT_BIN: ${{ github.workspace }}/remount-e15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
      - name: Install locked dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        working-directory: web
        run: npm audit
      - name: Unit and component tests
        working-directory: web
        run: npm test
      - name: Build and enforce reproducibility and size
        working-directory: web
        run: |
          npm run build
          npm run check:dist
          git diff --exit-code -- dist dist.sha256
      # The binary embeds web/dist and verifies it against dist.sha256 at
      # start-up, so it must be built AFTER the console build above or the
      # browser would be driven against a stale console.
      - name: Build the remount binary the browser suite drives
        env:
          CGO_ENABLED: "0"
        run: go build -o "$REMOUNT_BIN" ./cmd/remount
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: E15 browser-to-server flow
        working-directory: web
        run: npx playwright test
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e15-playwright
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7
          if-no-files-found: ignore
