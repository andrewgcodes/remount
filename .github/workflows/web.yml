name: Operator console

on:
  workflow_dispatch:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

# One run per workflow per ref. A newer push makes an older run's result
# irrelevant, and on a private repo that superseded run is still being
# billed - macOS minutes at 10x and Windows at 2x.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      # The E15 suite drives this binary; every server the browser talks to is
      # started from it by web/tests/e15/global-setup.mjs.
      REMOUNT_BIN: ${{ github.workspace }}/remount-e15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
      - name: Install locked dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        working-directory: web
        run: npm audit
      - name: Unit and component tests
        working-directory: web
        run: npm test
      - name: Build and enforce reproducibility and size
        working-directory: web
        run: |
          npm run build
          npm run check:dist
          git diff --exit-code -- dist dist.sha256
      # The binary embeds web/dist and verifies it against dist.sha256 at
      # start-up, so it must be built AFTER the console build above or the
      # browser would be driven against a stale console.
      - name: Build the remount binary the browser suite drives
        env:
          CGO_ENABLED: "0"
        run: go build -o "$REMOUNT_BIN" ./cmd/remount
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: E15 browser-to-server flow
        working-directory: web
        run: npx playwright test
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e15-playwright
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7
          if-no-files-found: ignore
