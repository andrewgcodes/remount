name: E18 release distribution

on:
  # release.yml creates the GitHub release with GITHUB_TOKEN. GitHub suppresses
  # events caused by that token, so chaining from workflow completion is the
  # reliable automatic boundary.
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed release tag to verify and package
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-contract:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve checkout ref
        id: candidate
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ref="${RUN_SHA:-$INPUT_TAG}"
          if [[ -z "$RUN_SHA" ]]; then
            [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.ref }}
          fetch-depth: 0
      - name: Bind release tag to the built commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ -n "$RUN_SHA" ]]; then
            mapfile -t tags < <(git tag --points-at "$RUN_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$')
            [[ ${#tags[@]} -eq 1 ]] || { echo "expected one semantic tag at $RUN_SHA" >&2; exit 1; }
            tag=${tags[0]}
          else
            tag=$INPUT_TAG
          fi
          [[ "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)" ]] || exit 1
          read -r object_type object_sha < <(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha'
          )
          [[ "$object_type" = tag ]]
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq -e '.verification.verified == true' >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Download the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ steps.release.outputs.tag }}" --dir released
      - name: Verify checksums
        working-directory: released
        run: sha256sum --check checksums.txt
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify checksum signer identity
        run: |
          cosign verify-blob \
            --bundle released/checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${{ steps.release.outputs.tag }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            released/checksums.txt
      - name: Verify SBOM is present and names release binaries
        run: |
          test -s released/remount.spdx.json
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64 windows-arm64; do
            grep -q "remount-$platform" released/remount.spdx.json
          done
      - name: Verify install.sh from an empty destination
        env:
          REMOUNT_GITHUB_REPOSITORY: ${{ github.repository }}
          REMOUNT_VERSION: ${{ steps.release.outputs.tag }}
          REMOUNT_INSTALL_DIR: ${{ runner.temp }}/install-bin
          REMOUNT_REQUIRE_SIGNATURE: "1"
        run: |
          ./install.sh
          test "$("$REMOUNT_INSTALL_DIR/remount" version)" = "remount $REMOUNT_VERSION"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
      - name: Verify public go install path
        env:
          GOBIN: ${{ runner.temp }}/go-install-bin
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          GOWORK=off go install "remount.dev/remount/cmd/remount@$TAG"
          test "$("$GOBIN/remount" version)" = "remount $TAG"
      - name: Generate formula from the release manifest
        run: |
          python3 scripts/release/generate_homebrew.py \
            --tag "${{ steps.release.outputs.tag }}" \
            --repository "$GITHUB_REPOSITORY" \
            --checksums released/checksums.txt \
            --output released/remount.rb
          ruby -c released/remount.rb
      - name: Upload generated formula to the release
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release.outputs.tag }}" released/remount.rb --clobber

  container:
    needs: release-contract
    # Manual dispatch is deliberately verification-only. Publishing follows
    # the trusted tag workflow and binds the image to its verified source tag.
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-contract.outputs.tag }}
      - name: Download Linux binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ needs.release-contract.outputs.tag }}" --dir dist --pattern 'remount-linux-*'
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Normalize image name
        id: registry
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/remount"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish multi-platform runtime image
        id: image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: packaging/container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.registry.outputs.image }}:${{ needs.release-contract.outputs.tag }}
          build-args: VERSION=${{ needs.release-contract.outputs.tag }}
          provenance: true
      - name: Attest container provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.registry.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless-sign immutable image digest
        env:
          IMAGE: ${{ steps.registry.outputs.image }}@${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - name: Verify published image by digest
        env:
          IMAGE: ${{ steps.registry.outputs.image }}@${{ steps.image.outputs.digest }}
          TAG: ${{ needs.release-contract.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-e18.yml@refs/heads/$DEFAULT_BRANCH" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE"
          test "$(docker run --rm "$IMAGE" version)" = "remount $TAG"
