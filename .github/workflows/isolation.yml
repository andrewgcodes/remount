name: isolation

on:
  pull_request:
    paths:
      - "internal/netns/**"
      - "internal/workspace/gvisor/**"
      - "scripts/gvisor-spike.sh"
      - ".github/workflows/isolation.yml"
  workflow_dispatch:

permissions:
  contents: read

# One run per workflow per ref. A newer push makes an older run's result
# irrelevant, and on a private repo that superseded run is still being
# billed - macOS minutes at 10x and Windows at 2x.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gvisor-e4:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install host tools and verified runsc
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl gnupg iproute2 nftables socat
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | \
            sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          runsc --version
          sudo runsc install --runtime=runsc
          sudo systemctl restart docker
          for attempt in $(seq 1 30); do
            docker info >/dev/null 2>&1 && break
            if [ "$attempt" -eq 30 ]; then
              echo "Docker did not recover after runsc registration" >&2
              exit 1
            fi
            sleep 1
          done
          docker info --format '{{json .Runtimes}}' | grep -q '"runsc"'
      - name: Build disposable Alpine rootfs
        shell: bash
        run: |
          set -euo pipefail
          container=$(docker create alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          sudo rm -rf /tmp/remount-gvisor-rootfs
          mkdir -p /tmp/remount-gvisor-rootfs
          docker export "$container" | sudo tar -C /tmp/remount-gvisor-rootfs -xf -
          CGO_ENABLED=0 GOOS=linux go build -o /tmp/rawprobe ./internal/workspace/gvisor/testdata/rawprobe
          sudo install -m 0755 /tmp/rawprobe /tmp/remount-gvisor-rootfs/rawprobe
          CGO_ENABLED=0 GOOS=linux go build -o /tmp/udpprobe ./internal/workspace/gvisor/testdata/udpprobe
          sudo install -m 0755 /tmp/udpprobe /tmp/remount-gvisor-rootfs/udpprobe
      - name: Run gVisor isolation conformance
        shell: bash
        run: |
          set -euo pipefail
          REMOUNT_GVISOR_INTEGRATION=1 \
          REMOUNT_GVISOR_ROOTFS=/tmp/remount-gvisor-rootfs \
          REMOUNT_CHAOS_IMAGE=alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce \
            ./scripts/gvisor-conformance.sh
      - name: Unit and race tests
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./internal/netns ./internal/workspace/gvisor
          go test -race -count=10 ./internal/netns ./internal/workspace/gvisor
