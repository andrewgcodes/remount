name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          check-latest: false
      - uses: Azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.20.0
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      # Catches reads of mutex-guarded state after an unlock, a class of race
      # that only shows up intermittently under -race.
      - name: lock discipline
        run: ./scripts/lint-locks.sh .
      - name: test
        run: go test -p 1 -count=1 -timeout 600s -skip '^TestHandoffScaleAndControlFailover$' ./...
      # The failure model lives in internal/sim and is where races would show.
      - name: race
        run: go test -race -p 1 -count=1 -timeout 1200s -skip '^TestHandoffScaleAndControlFailover$' ./...
      - name: record hosted-runner scale debt
        if: always()
        run: |
          {
            echo "### Hosted-runner scale exclusion"
            echo
            echo 'The ordinary and race package lanes exclude `TestHandoffScaleAndControlFailover`:'
            echo 'under hosted-runner load, the 200-session post-restart reattach deadline is not reliable.'
            echo 'The exact scale test remains in `make test`, `make race`, and focused developer runs.'
          } >> "$GITHUB_STEP_SUMMARY"

  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          check-latest: false
      - name: install race-detector C toolchain
        run: choco install mingw --version=16.1.0 --no-progress -y
      - name: gofmt
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) {
            $files
            exit 1
          }
      - name: vet
        run: go vet ./...
      - name: lock discipline
        shell: bash
        run: ./scripts/lint-locks.sh .
      - name: test
        run: |
          # Windows Server 2022 currently measures the 64 MiB incompressible
          # Plan B move at 7.6-8.3 MB/s against the 20 MB/s benchmark gate.
          # Its native process-start floor can also hide the artifact-tier
          # seal cost, making the ratio lane fail its skipped-success guard.
          # The full suite can also fence the Docker OpenCode lanes during
          # install or streaming, although focused deterministic-lane runs pass.
          # Restarting 200 clients can exceed the session reattach deadline on
          # hosted Windows; keep that exact scale debt visible below.
          # Serialize packages so the sim timing lanes are not competing with
          # cross-compilation and artifact installation for host resources.
          go test -p 1 -count=1 -timeout 2400s -skip '^(TestExecRoundTripCostOfTheDurableSessionTier|TestPlanbPerfMoveIncompressible|TestPlanBOpenCodeAgentTranscriptApprovalAndResume|TestPlanBOpenCodeDeterministicModelLane|TestHandoffScaleAndControlFailover)$' ./...
          Push-Location integration/publicsdk
          go test -count=1 ./...
      - name: race
        run: |
          # Under the race detector the Docker OpenCode lane can fence the
          # workspace and then wait forever for the session stream to close.
          # Serialize packages: concurrent race builds and the 200-node scale
          # lane can exhaust Windows asynchronous file-I/O resources.
          go test -race -p 1 -count=1 -timeout 3600s -skip '^(TestPlanbPerfMoveIncompressible|TestPlanBOpenCodeAgentTranscriptApprovalAndResume|TestPlanBOpenCodeDeterministicModelLane|TestHandoffScaleAndControlFailover)$' ./...
      - name: native conformance
        run: go run ./cmd/conformance --build .
      - name: unavailable Windows boundaries
        shell: pwsh
        run: |
          @'
          ## Native Windows boundaries
          - Unix PTYs are unavailable until a ConPTY backend exists.
          - Recipe install and ACP launcher scripts are unavailable in Windows process workspaces because they require a POSIX shell.
          - Firecracker and gVisor are Linux-kernel backends and are not attempted.
          - Parent-directory fsync has no portable Go equivalent on Windows.
          - Artifact installation lanes report unavailable when their named GNU make, Syft, Python, Helm, or OpenTofu prerequisite is absent.
          - TestExecRoundTripCostOfTheDurableSessionTier is known failing in ordinary runs: the Windows process-start floor can mask the artifact-tier seal cost, and two of three focused runs tripped the skipped-success guard at 1.15x and 1.14x; three race runs measured 1.47x, 1.44x, and 1.32x and passed.
          - TestPlanbPerfMoveIncompressible is known failing: three final focused runs measured 7.6-8.3 MB/s on Windows Server 2022 versus the 20 MB/s gate; the earlier full-suite run measured 9.2 MB/s.
          - TestPlanBOpenCodeAgentTranscriptApprovalAndResume is known failing in the full suite: the Docker workspace fences during the pinned OpenCode install and the install session reaches its fifteen-minute context deadline; a focused ordinary run passes.
          - TestPlanBOpenCodeDeterministicModelLane is known failing in full-suite ordinary and race runs: the Docker workspace fences and its session stream does not close before the ten-minute test context expires; focused ordinary and race runs pass.
          - TestHandoffScaleAndControlFailover is known failing on hosted Windows: after a 16-second control restart, at least one of 200 live sessions exceeded the client's 30-second reattach deadline.
          '@ | Add-Content $env:GITHUB_STEP_SUMMARY

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
      - name: cross-compile every platform
        run: make dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: remount-binaries
          path: dist/

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
      - name: module integrity
        run: |
          go mod verify
          go mod tidy -diff
      - name: install pinned analyzers
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: staticcheck
        run: staticcheck ./...
      - name: vulnerability scan
        run: govulncheck ./...
      - name: seeded fuzz corpus
        run: go test ./... -run='^Fuzz'

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
      - name: hostile-workspace conformance
        run: make conformance
      - name: bounded fuzzing
        run: make fuzz FUZZTIME=10s
