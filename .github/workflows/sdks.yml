name: SDKs

on:
  workflow_dispatch:
  push:
    paths:
      - "cmd/protogen/**"
      - "internal/proto/**"
      - "spec/protocol.schema.json"
      - "sdk/**"
      - "integration/sdks/**"
      - ".github/workflows/sdks.yml"
  pull_request:
    paths:
      - "cmd/protogen/**"
      - "internal/proto/**"
      - "spec/protocol.schema.json"
      - "sdk/**"
      - "integration/sdks/**"
      - ".github/workflows/sdks.yml"

permissions:
  contents: read

jobs:
  generated-and-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.x"
      - name: Verify generated protocol artifacts
        run: go run ./cmd/protogen --check
      - name: Test generator
        run: go test -race ./cmd/protogen
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Build and test Python package
        run: |
          python -m pip install --upgrade build
          python -m pip install -e './sdk/python[test]'
          python -m pytest -q sdk/python
          python -m build sdk/python
          python -m venv "${RUNNER_TEMP}/remount-python-consumer"
          "${RUNNER_TEMP}/remount-python-consumer/bin/pip" install sdk/python/dist/*.whl
          "${RUNNER_TEMP}/remount-python-consumer/bin/python" -c 'from remount import AgentClient, Client, Terminal'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Build and test TypeScript package
        working-directory: sdk/typescript
        run: |
          npm ci --ignore-scripts
          npm audit
          npm test
          npm run build
          SDK_TARBALL="$(npm pack --pack-destination "${RUNNER_TEMP}" --silent)"
          mkdir "${RUNNER_TEMP}/remount-ts-consumer"
          npm init --yes --prefix "${RUNNER_TEMP}/remount-ts-consumer"
          npm install --prefix "${RUNNER_TEMP}/remount-ts-consumer" "${RUNNER_TEMP}/${SDK_TARBALL}"
          cd "${RUNNER_TEMP}/remount-ts-consumer"
          node -e 'require("@remount/sdk")'
          node --input-type=module -e 'import("@remount/sdk")'

  live-e12:
    if: vars.REMOUNT_E12_URL != ''
    runs-on: ubuntu-latest
    needs: generated-and-packages
    env:
      REMOUNT_E12_URL: ${{ vars.REMOUNT_E12_URL }}
      REMOUNT_E12_TOKEN: ${{ secrets.REMOUNT_E12_TOKEN }}
      REMOUNT_E12_RECIPE: ${{ vars.REMOUNT_E12_RECIPE }}
      REMOUNT_E12_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Exercise both SDKs against the same server
        run: |
          python -m pip install ./sdk/python
          npm ci --ignore-scripts --prefix sdk/typescript
          npm run build --prefix sdk/typescript
          python integration/sdks/python_e12.py
          node integration/sdks/typescript_e12.mjs
