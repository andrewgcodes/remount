[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "remount"
version = "0.1.0"
description = "Async Python SDK for Remount"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
keywords = ["agents", "sandbox", "workspace", "runtime", "remount"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://github.com/andrewgcodes/remount"
Documentation = "https://github.com/andrewgcodes/remount/blob/main/docs/using-remount.md"
Source = "https://github.com/andrewgcodes/remount"
Changelog = "https://github.com/andrewgcodes/remount/blob/main/CHANGELOG.md"
dependencies = [
  "cbor2>=5.6,<6",
  "httpx>=0.27,<1",
  "websockets>=15,<18",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/remount"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
