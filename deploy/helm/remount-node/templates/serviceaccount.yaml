{{- if .Values.serviceAccount.create }}
# A service account with no RoleBinding.
#
# The node needs no Kubernetes API access at all: it dials the Remount control
# plane outbound and receives claims over that connection. Granting it RBAC to
# create or delete objects would be the first step towards Kubernetes owning
# something Remount already owns.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "remount-node.serviceAccountName" . }}
  labels:
    {{- include "remount-node.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
